name: Refresh Le Fil Libre feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-pages-feed.mjs'
      - '.github/workflows/refresh-feed.yml'

permissions:
  contents: write

concurrency:
  group: refresh-lefil-libre-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh six-hour feed and share pages
        run: node scripts/update-pages-feed.mjs

      - name: Commit feed and share pages when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- feed.json articles)" ]; then
            echo "No feed or share-page change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json articles
          git commit -m "chore: refresh six-hour news feed and share pages"
          git pull --rebase origin main
          git push origin HEAD:main
