name: Check LinkedIn backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/check-linkedin-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax
        working-directory: backend
        run: npm run check
